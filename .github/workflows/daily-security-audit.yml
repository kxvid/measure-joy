name: Daily Security Audit

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency audit (${{ matrix.scope }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        scope: [production, all]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - name: Verify the authoritative lockfile
        run: |
          test ! -f package-lock.json
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Audit locked dependencies
        shell: bash
        env:
          AUDIT_SCOPE: ${{ matrix.scope }}
        run: |
          # Invalid output or network failures must fail this check, never become
          # a fabricated zero-vulnerability report. Preserve the scanner status.
          args=(--json --audit-level=low)
          if [ "$AUDIT_SCOPE" = production ]; then args+=(--prod); fi
          set +e
          pnpm audit "${args[@]}" > dependency-audit.json
          audit_status=$?
          set -e
          jq -e '
            .metadata.vulnerabilities as $v |
            ["info", "low", "moderate", "high", "critical"] |
            all(.[]; . as $key | $v[$key] |
              type == "number" and . >= 0 and . == floor)
          ' dependency-audit.json > /dev/null
          jq '.metadata.vulnerabilities' dependency-audit.json
          jq -e '[.metadata.vulnerabilities | .low, .moderate, .high, .critical] | all(.[]; . == 0)' dependency-audit.json > /dev/null
          exit "$audit_status"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: dependency-audit-${{ matrix.scope }}-${{ github.run_id }}
          path: dependency-audit.json
          if-no-files-found: error
          retention-days: 30

  security-headers:
    name: Production security headers
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require production security headers
        shell: bash
        run: |
          status=$(curl --fail --silent --show-error --head --max-time 30 --dump-header security-headers.txt --output /dev/null --write-out '%{http_code}' https://www.measurejoy.org)
          test "$status" = 200
          missing=0
          for header in strict-transport-security x-content-type-options x-frame-options content-security-policy referrer-policy permissions-policy; do
            if ! grep -qi "^${header}:" security-headers.txt; then
              echo "::error::Missing required security header: $header"
              missing=1
            fi
          done
          exit "$missing"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: security-headers-${{ github.run_id }}
          path: security-headers.txt
          retention-days: 30

  zap-scan:
    name: OWASP ZAP passive baseline
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: zaproxy/action-baseline@6c5a007541891231cd9e0ddec25d4f25c59c9874 # v0.15.0
        with:
          target: https://www.measurejoy.org
          # Crawl links only. AJAX interaction and generated form submissions can
          # send customer messages or create checkout sessions on the live site.
          # Use the traditional runner so its explicit spider settings apply.
          cmd_options: >-
            -a -m 1 -T 5 --autooff
            -z "-config spider.processform=false -config spider.postform=false -config spider.thread=2"
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-passive-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Summarize production scan
        if: always()
        shell: bash
        run: |
          if ! jq -e '.site | type == "array" and length > 0' report_json.json > /dev/null; then
            echo "::error::ZAP did not produce a valid site report; inspect the scan logs."
            exit 1
          fi
          {
            echo '### Production OWASP ZAP scan'
            echo 'Target: https://www.measurejoy.org. This scans the deployed storefront, not the checked-out branch.'
            echo 'Form submission and AJAX interactions are disabled. Findings still fail the check.'
            echo 'Alert counts by ZAP risk code (0 informational, 1 low, 2 medium, 3 high):'
            echo '```json'
            jq '[.site[].alerts[]?] | group_by(.riskcode) | map({riskcode: .[0].riskcode, alerts: length})' report_json.json
            echo '```'
            echo 'Download the ZAP artifact for affected URLs and remediation details.'
          } >> "$GITHUB_STEP_SUMMARY"
