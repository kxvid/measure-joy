version: 2
updates:
  # pnpm uses the npm ecosystem. pnpm-lock.yaml is the only install lockfile.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "07:00"      # UTC — before the security audit runs at 08:00
    open-pull-requests-limit: 8
    labels:
      - "dependencies"
      - "automated"
    # Keep framework and peer packages together; review all update PRs.
    groups:
      framework:
        patterns:
          - "next"
          - "eslint-config-next"
          - "@next/*"
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
        update-types: ["minor", "patch"]
      security-patches:
        applies-to: security-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      radix-ui:
        patterns:
          - "@radix-ui/*"
      stripe:
        patterns:
          - "stripe"
          - "@stripe/*"
      supabase:
        patterns:
          - "@supabase/*"
      clerk:
        patterns:
          - "@clerk/*"
    # Pin major versions of core framework deps — review manually
    ignore:
      - dependency-name: "@clerk/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # ── GitHub Actions ────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
    labels:
      - "dependencies"
      - "github-actions"
      - "automated"
